<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="w-10/12 mx-auto mt-16">
      <div class="flex flex-col gap-y-6 items-center">
        <!-- Header -->

        <h1 class="text-lg text-primary font-semibold text-center">
          انتقادات، نظرات و پیشنهادات خودتان را با ما درمیان بگذارید
        </h1>

        <!-- Form -->

        <div class="flex flex-col gap-y-2 items-center w-6/12">
          <div class="flex gap-x-2 w-full">
            <input
              type="text"
              name=""
              id=""
              placeholder="نام و نام خانوادگی"
              class="border-2 border-secondary p-2 flex-1"
            />
            <input
              type="email"
              name=""
              id=""
              placeholder="ایمیل"
              class="border-2 border-secondary p-2 flex-1"
            />
          </div>
          <div class="flex gap-x-2 w-full">
            <input
              type="number"
              name=""
              id=""
              placeholder="شماره تماس"
              class="border-2 border-secondary p-2 flex-1"
            />
            <input
              type="text"
              name=""
              id=""
              placeholder="موضوع"
              class="border-2 border-secondary p-2 flex-1"
            />
          </div>
          <div class="w-full">
            <textarea
              name=""
              id=""
              placeholder="لطفا متن خود را وارد کنید"
              class="border-2 border-secondary p-2 min-h-24 w-full text-sm"
            ></textarea>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
